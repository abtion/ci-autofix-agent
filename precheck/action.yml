name: 'CI Autofix — Precheck'
description: >
  Kill-switch check, fixable-jobs filter, and consecutive-retry guard.
  Must be called after actions/checkout (fetch-depth: 0) in the same job.

inputs:
  bot_name:
    description: 'GitHub App bot name (without the [bot] suffix)'
    required: true
  fixable_jobs:
    description: 'ERE regex matching CI job names the agent can fix (e.g. "rubocop|jest|eslint")'
    required: true
  workflow_run_id:
    description: 'ID of the failed workflow run. Leave empty for non-workflow_run events (e.g. pull_request_review); the fixable-jobs check is then skipped.'
    required: false
    default: ''
  allowed_review_actors:
    description: >
      For pull_request_review triggers: which reviewer account types may trigger
      the agent — "bots" (default), "humans", or "all". Ignored for events other
      than pull_request_review. A bot's review must ALSO clear the caller's
      allowed_bots list to actually run.
    required: false
    default: 'bots'
  allowed_bots:
    description: >
      Comma-separated bot logins allowed to trigger via a pull_request_review,
      matched case-insensitively (ignoring a trailing "[bot]") against the
      workflow actor github.actor — the same identity claude-code-action checks.
      Mirror the value passed to run-agent. Default "*" disables this early check
      and defers entirely to run-agent's own allow-list.
    required: false
    default: '*'
  github_token:
    description: 'Token for gh CLI calls (GITHUB_TOKEN is sufficient)'
    required: true
  repository:
    description: 'Repository in owner/repo format'
    required: true

outputs:
  enabled:
    description: "'true' if the agent should run, 'false' if it should be skipped"
    value: ${{ steps.check.outputs.enabled }}

runs:
  using: 'composite'
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
        REPO: ${{ inputs.repository }}
        FIXABLE_CI_JOBS: ${{ inputs.fixable_jobs }}
        ALLOWED_REVIEW_ACTORS: ${{ inputs.allowed_review_actors }}
        ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        BOT_LOGIN: ${{ inputs.bot_name }}[bot]
      run: |
        if [ -f .github/CI_AUTOFIX_DISABLED ]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Autofix agent disabled via kill-switch file."
          exit 0
        fi

        # Review-actor filter. Read the review author's account type straight from
        # the event payload, so the bots-only default self-enforces without the
        # caller wiring anything. Empty for non-review events (no .review in the
        # payload) → filter skipped. A bot's review must ALSO clear allowed_bots
        # downstream.
        review_actor_type=""
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          review_actor_type=$(jq -r '.review.user.type // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
        fi
        if [ -n "$review_actor_type" ]; then
          case "$ALLOWED_REVIEW_ACTORS" in
            bots)
              if [ "$review_actor_type" != "Bot" ]; then
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "Review by a ${review_actor_type}; only bot reviews trigger the agent (allowed_review_actors=bots)."
                exit 0
              fi
              ;;
            humans)
              if [ "$review_actor_type" != "User" ]; then
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "Review by a ${review_actor_type}; only human reviews trigger the agent (allowed_review_actors=humans)."
                exit 0
              fi
              ;;
            all)
              : # all reviewers (bot + human) allowed
              ;;
            *)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Invalid allowed_review_actors='${ALLOWED_REVIEW_ACTORS}' (expected bots|humans|all); skipping."
              exit 0
              ;;
          esac

          # For bot reviews, reject non-allow-listed bots here — before the fix
          # job spins up — mirroring claude-code-action's allowed_bots gate. Match
          # on the workflow actor (github.actor / GITHUB_ACTOR), the same identity
          # claude-code-action checks, normalized the same way (lowercased, any
          # trailing "[bot]" stripped). Humans bypass allowed_bots (their write
          # access is enforced downstream). ALLOWED_BOTS="*" disables this check.
          if [ "$review_actor_type" = "Bot" ]; then
            norm() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed 's/\[bot\]$//'; }
            actor_norm=$(norm "$GITHUB_ACTOR")
            bot_allowed=false
            IFS=',' read -ra _allow <<< "$ALLOWED_BOTS" || true
            for entry in "${_allow[@]}"; do
              entry=$(printf '%s' "$entry" | tr -d '[:space:]')
              [ -z "$entry" ] && continue
              if [ "$entry" = "*" ] || [ "$(norm "$entry")" = "$actor_norm" ]; then
                bot_allowed=true
                break
              fi
            done
            if [ "$bot_allowed" != "true" ]; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Bot reviewer '${GITHUB_ACTOR}' is not in allowed_bots; skipping (add it to allowed_bots or use '*')."
              exit 0
            fi
          fi
        fi

        # Fixable-jobs check only applies when we have a failed workflow run.
        # For non-workflow_run triggers (pull_request_review, etc.) skip it.
        if [ -n "$WORKFLOW_RUN_ID" ]; then
          failed_jobs=$(gh run view "$WORKFLOW_RUN_ID" \
            --repo "$REPO" \
            --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' 2>/dev/null || true)
          echo "Failed jobs:"
          echo "$failed_jobs"
          if ! echo "$failed_jobs" | grep -qE "^(${FIXABLE_CI_JOBS})$"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No fixable jobs failed; skipping."
            exit 0
          fi
        else
          echo "No workflow_run_id provided; skipping fixable-jobs check (non-CI trigger)."
        fi

        count=0
        while IFS= read -r name; do
          [ "$name" = "$BOT_LOGIN" ] || break
          count=$((count + 1))
        done < <(git log --format="%an")
        echo "Consecutive agent commits at HEAD: ${count}"
        if [ "$count" -ge 3 ]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Max retries reached (${count}/3); skipping."
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi
