name: Agent — Fix CI / Address Reviews

on:
  workflow_run:
    workflows: ["CI"]   # Must match the name: field of your CI workflow exactly
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

# ─── Project configuration ────────────────────────────────────────────────────
env:
  # GitHub App bot name (without the [bot] suffix).
  AGENT_BOT_NAME: "claude-autofixing-agent"

  # ERE regex matching the CI job names this agent is allowed to fix.
  # Jobs NOT in this list will never trigger the agent (saves API credits).
  # Example for a Rails + TypeScript project:
  #   FIXABLE_CI_JOBS: "rubocop|brakeman|tsc|eslint|jest|rspec|erb-lint|prettier|schema"
  FIXABLE_CI_JOBS: "replace-with-your-fixable-job-names"

  # Comma-separated accounts allowed to TRIGGER the agent, matched against the
  # workflow actor (github.actor). Covers CI failures on a bot's PR (e.g.
  # Dependabot) AND which reviewers' feedback the agent acts on. Add more as
  # needed (e.g. "dependabot[bot],renovate[bot]"). Matching is case-insensitive
  # and ignores a trailing "[bot]".
  # NOTE: the actor is not always the review author. GitHub's built-in Copilot
  # review runs as actor "Copilot", so allow "Copilot" (NOT
  # "copilot-pull-request-reviewer[bot]") to act on it. When unsure, read the
  # "Checking permissions for actor: <name>" line in the run log.
  # Use "*" to allow all bots (avoid "*" on public repos — external Apps could
  # invoke the agent).
  ALLOWED_BOTS: "dependabot[bot]"

  # For pull_request_review triggers: which reviewer account types may trigger
  # the agent. One of:
  #   bots   — only bot reviews (Copilot, Gemini, etc.) — default
  #   humans — only human reviews
  #   all    — either
  # A bot reviewer must ALSO be listed in ALLOWED_BOTS above to trigger.
  REVIEW_TRIGGER_ACTORS: "bots"

  # Maximum Claude turns per run. Raise for complex codebases.
  MAX_TURNS: "60"

  # Claude model to use. Defaults to claude-sonnet-4-6.
  MODEL: "claude-sonnet-4-6"

  # Extra Bash tool patterns the agent may call, beyond the built-in defaults.
  # Format: comma-separated Bash(...) patterns (no surrounding quotes needed).
  # Built-in defaults already include: git, gh, jq, grep, find, ls, cat, sed,
  # awk, sort, uniq, diff, wc, cp, mv, rm, mkdir, head, tail, bash, and more.
  # Example for a Rails project:
  #   EXTRA_ALLOWED_TOOLS: "Bash(bundle:*),Bash(bin/rake:*),Bash(bin/rspec:*),Bash(bin/rubocop:*),Bash(psql:*),Bash(npm:*),Bash(npx:*)"
  EXTRA_ALLOWED_TOOLS: ""
# ──────────────────────────────────────────────────────────────────────────────

concurrency:
  group: agent-fix-ci-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    # Two triggers: PR-triggered CI failures from the same repo, OR a PR review
    # submitted on a same-repo PR. Approvals never trigger work; only
    # changes_requested or commented reviews do.
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
       contains(fromJSON('["changes_requested","commented"]'), github.event.review.state) &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.precheck.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: abtion/ci-autofix-agent/precheck@v1
        id: precheck
        with:
          bot_name: ${{ env.AGENT_BOT_NAME }}
          fixable_jobs: ${{ env.FIXABLE_CI_JOBS }}
          # Empty for pull_request_review; the precheck then skips fixable-jobs check.
          workflow_run_id: ${{ github.event.workflow_run.id }}
          # Empty for non-review triggers; the review-actor filter is then skipped.
          review_actor_type: ${{ github.event.review.user.type }}
          allowed_review_actors: ${{ env.REVIEW_TRIGGER_ACTORS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

  fix:
    needs: precheck
    # Same-repo guards repeated as defence-in-depth — both workflow_run and
    # pull_request_review expose write tokens and secrets to the workflow.
    if: |
      needs.precheck.outputs.enabled == 'true' && (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'failure' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' &&
         contains(fromJSON('["changes_requested","commented"]'), github.event.review.state) &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest

    # ── Database / service containers ─────────────────────────────────────────
    # Uncomment and adapt if your project needs a database or other services.
    # Services must be declared here (GitHub Actions limitation — they cannot
    # be conditionally added inside a reusable action).
    #
    # env:
    #   DATABASE_URL: postgres://postgres:postgres@localhost:5432
    #   RAILS_ENV: test
    #
    # services:
    #   postgres:
    #     image: postgres:15
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_HOST_AUTH_METHOD: trust
    #     ports:
    #       - 5432:5432
    #     options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5
    # ──────────────────────────────────────────────────────────────────────────

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          fetch-depth: 0

      # ── Project-specific setup ─────────────────────────────────────────────
      # Add the steps needed to make your CI commands runnable on a fresh
      # Ubuntu runner. These run before Claude so the agent can reproduce and
      # verify fixes locally.
      #
      # Ruby / Rails example:
      #   - name: Install apt packages
      #     run: sudo apt-get -y install libpq-dev imagemagick
      #   - uses: ruby/setup-ruby@v1
      #     with:
      #       bundler-cache: true
      #   - name: Set up database
      #     run: |
      #       bin/rake db:create
      #       bin/rake db:schema:load
      #
      # Node.js example:
      #   - uses: actions/setup-node@v6
      #     with:
      #       node-version-file: ".tool-versions"
      #       cache: "npm"
      #   - run: npm ci
      #
      # pnpm example:
      #   - uses: pnpm/action-setup@v6
      #     with:
      #       version: 9
      #   - uses: actions/setup-node@v6
      #     with:
      #       node-version: 20
      #       cache: pnpm
      #   - run: pnpm install --frozen-lockfile
      # ──────────────────────────────────────────────────────────────────────

      - name: Run CI autofix agent
        uses: abtion/ci-autofix-agent/run-agent@v1
        with:
          app_id: ${{ secrets.AUTOFIX_APP_ID }}
          app_private_key: ${{ secrets.AUTOFIX_PRIVATE_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: ${{ env.AGENT_BOT_NAME }}
          max_turns: ${{ env.MAX_TURNS }}
          model: ${{ env.MODEL }}
          allowed_tools: ${{ env.EXTRA_ALLOWED_TOOLS }}
          allowed_bots: ${{ env.ALLOWED_BOTS }}
